<h2 mat-dialog-title>{{ veiculo.marca }} {{ veiculo.modelo }}</h2>
<mat-dialog-content>
  <dl class="detail-grid">
    <div>
      <dt>Ano</dt>
      <dd>{{ veiculo.ano }}</dd>
    </div>
    <div>
      <dt>Preço</dt>
      <dd>{{ veiculo.preco | currency: 'BRL' }}</dd>
    </div>
    <div>
      <dt>Cor</dt>
      <dd>{{ veiculo.cor }}</dd>
    </div>
    <div>
      <dt>Quilometragem</dt>
      <dd>{{ veiculo.quilometragem | number }} km</dd>
    </div>
    <div>
      <dt>Status</dt>
      <dd>
        <span class="status-chip" [class]="statusColor[veiculo.status]">{{ statusLabels[veiculo.status] }}</span>
      </dd>
    </div>
    <div>
      <dt>Cadastrado em</dt>
      <dd>{{ veiculo.createdAt | date: 'dd/MM/yyyy HH:mm' }}</dd>
    </div>
  </dl>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
