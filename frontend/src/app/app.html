<mat-sidenav-container class="app-shell">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="app-sidenav"
  >
    <div class="app-brand">
      <img src="logo.png" alt="" class="app-brand-icon" />
      <span>Chave na Mão</span>
    </div>
    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive="active-link"
          (click)="isMobile() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">
        <span class="toolbar-title-full">Chave na Mão — CRM de Venda de Carros</span>
        <span class="toolbar-title-short">Chave na Mão</span>
      </span>
      <span class="toolbar-spacer"></span>
      <button
        mat-icon-button
        (click)="themeService.toggle()"
        [matTooltip]="themeService.dark() ? 'Mudar para modo claro' : 'Mudar para modo escuro'"
        [attr.aria-label]="themeService.dark() ? 'Mudar para modo claro' : 'Mudar para modo escuro'"
      >
        <mat-icon>{{ themeService.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
