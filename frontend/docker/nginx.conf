server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Suporte ao roteamento client-side do Angular (recarregar /veiculos, /clientes/1/editar etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Config de runtime nunca deve ser cacheada pelo navegador
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # index.html referencia os arquivos JS/CSS com hash no nome (ex. main-AB12CD.js);
    # se o navegador cachear o index.html antigo, ele continua carregando o bundle
    # antigo indefinidamente mesmo depois de um novo deploy - por isso precisa ser
    # sempre revalidado, diferente dos arquivos com hash abaixo (esses sim podem
    # ficar em cache por muito tempo, porque o nome muda quando o conteudo muda).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
